name: Build all Minecraft versions

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            java: '17'
            loader: forge
          - minecraft: '1.21.1'
            java: '21'
            loader: neoforge
          - minecraft: '1.19.1'
            java: '17'
            loader: forge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build distributable
        run: ./scripts/mod.sh "$MC" --no-daemon clean build
        env:
          MC: ${{ matrix.minecraft }}
      - name: Verify JAR and create checksum
        run: python3 scripts/verify-artifact.py "$MC" dist
        env:
          MC: ${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v7
        with:
          name: pinkkicore-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
