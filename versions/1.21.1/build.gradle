plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}
def metadata = new Properties()
file('../../mod.properties').withInputStream { metadata.load(it) }
metadata.each { key, value -> ext.set(key.toString(), value) }
version = mod_version
group = mod_group
base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.resources {
    srcDir '../../common/src/main/resources'
    exclude 'META-INF/mods.toml'
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            gameDirectory = project.file("run/${name}")
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

def replacements = metadata.collectEntries { key, value -> [(key.toString()): value] } + [
    minecraft_version: minecraft_version, neo_version: neo_version, pack_format: pack_format
]
def generateMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir generateMetadata
neoForge.ideSyncTask generateMetadata
tasks.named('processResources', ProcessResources).configure {
    inputs.properties replacements
    filesMatching('pack.mcmeta') { expand replacements }
}
tasks.named('jar', Jar).configure {
    from('../../LICENSE')
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach { standardInput = System.in }
