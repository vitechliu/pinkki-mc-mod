// Wiki is the authoritative player prose. Generated guide JSON stays in build/.
def guideOutput = layout.buildDirectory.dir('generated/guide')
tasks.register('generateGuide', Exec) {
    workingDir rootProject.file('../..')
    commandLine 'python3', 'scripts/generate-guide.py', '--output', guideOutput.get().asFile.absolutePath
    inputs.files(fileTree('../../wiki') { include '*.md' }, '../../scripts/generate-guide.py')
    outputs.dir guideOutput
}
sourceSets.main.resources.srcDir guideOutput
tasks.named('processResources').configure { dependsOn 'generateGuide' }

