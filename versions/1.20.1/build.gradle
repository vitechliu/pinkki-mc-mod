plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply from: '../../gradle/forge.gradle'

repositories {
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
            includeGroup 'com.eliotlash.mclib'
        }
    }
}

dependencies {
    // Compile against the compatibility floor; modpacks may keep a newer 4.x.
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    // GeckoLib embeds this in its release JAR; development runs need it explicitly.
    implementation 'com.eliotlash.mclib:mclib:20'
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // Explicit development opt-in. Normal builds/servers do not install JEI.
    if (project.hasProperty('jeiRuntime')) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
}

// Opt-in headless release-JAR probe. This source set is never packaged in the mod.
if (project.hasProperty('bingwaProbe')) {
    sourceSets {
        bingwaProbe {
            java.srcDir '../../scripts/tests/bingwa_probe'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }
    tasks.register('bingwaProbeJar', Jar) {
        archiveFileName = 'bingwa-probe.jar'
        from sourceSets.bingwaProbe.output
        from('../../scripts/tests/bingwa_probe/mods.toml') { into 'META-INF' }
    }
    reobf {
        bingwaProbeJar { classpath.from(sourceSets.bingwaProbe.compileClasspath) }
    }
    tasks.named('bingwaProbeJar').configure { finalizedBy 'reobfBingwaProbeJar' }
}

