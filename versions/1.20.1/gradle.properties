org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.workers.max=2
minecraft_version=1.20.1
forge_version=47.4.28
# Build with a fixed SDK; do not force modpacks to upgrade to that SDK version.
forge_min_version=47.1.0
geckolib_version=4.4.9
geckolib_version_range=[4.4.9,5)
# Same API floor as the local Mekanism 1.20.x reference; JEI remains optional.
jei_version=15.2.0.27
jei_version_range=[15.2.0.27,16)
java_version=17
pack_format=15

# Bound URLConnection waits used by historical Minecraft tooling. TLS stays enabled.
systemProp.sun.net.client.defaultConnectTimeout=15000
systemProp.sun.net.client.defaultReadTimeout=60000
